<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title data-i18n="app.title">HyperDR — HDR 图片转换</title>
<script>
  /* Painted before first paint, so a stored choice never flashes the wrong theme. */
  try {
    var t = localStorage.getItem("hyperdr.theme");
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<!-- Relative hrefs, so this tree also opens from disk. The panel's CSP sets
     base-uri 'none', so a <base> tag is not available as an alternative. -->
<link rel="stylesheet" href="./css/tokens.css">
<link rel="stylesheet" href="./css/base.css">
<link rel="stylesheet" href="./css/shell.css">
<link rel="stylesheet" href="./css/components.css">
</head>
<body>
<!-- Two columns, not three bands. The photograph owns the full height of the
     window's left side; everything the user operates -- identity, adjustment,
     output, the run button -- is one uninterrupted top-to-bottom column on the
     right, in the order the task is performed. -->
<div class="app">

  <!-- The masthead is a line at the top of the control column, not a band
       across the window: a title bar spanning the page pushed the photograph
       down by its own height plus a region gap for no work in return. -->


  <!-- Full window height. No heading: a panel containing one large photograph
       does not need a caption saying it is the preview. -->
  <main class="app__stage" id="stage" data-i18n-attr="aria-label:stage.label">
    <div class="stage-viewport">
      <!-- One photograph at a time; picking another replaces it. -->
      <div class="stage" data-role="stage" aria-busy="false">
        <div class="stage-frame">
          <canvas data-role="canvas-hdr" hidden data-i18n-attr="aria-label:stage.canvasHdr"></canvas>
          <canvas data-role="canvas-sdr" hidden data-i18n-attr="aria-label:stage.canvasSdr"></canvas>
          <canvas data-role="canvas-original" hidden aria-hidden="true"></canvas>
          <canvas data-role="canvas-zebra-hot" hidden aria-hidden="true"></canvas>
          <canvas data-role="canvas-zebra-cold" hidden aria-hidden="true"></canvas>
          <canvas data-role="canvas-mask" hidden aria-hidden="true"></canvas>
          <div class="stage-divider" data-role="divider" hidden
               role="slider" tabindex="0" data-i18n-attr="aria-label:stage.divider"
               aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
            <span class="stage-divider-line"></span>
            <span class="stage-divider-handle"></span>
          </div>
          <div class="stage-hint" data-role="stage-hint" hidden></div>
          <div class="stage-upload" data-role="stage-upload" hidden>
            <span data-role="stage-upload-text"></span>
            <button class="stage-upload-cancel" type="button" data-role="upload-cancel" data-i18n="stage.uploadCancel">取消上传</button>
          </div>
          <span class="stage-badge" data-role="hdr-badge" hidden>HDR</span>
          <button class="icon-button stage-expand" type="button"
                  data-role="stage-expand" aria-pressed="false">
            <svg class="stage-expand-icon--open" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/>
            </svg>
            <svg class="stage-expand-icon--close" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 9h5V4M20 9h-5V4M4 15h5v5M20 15h-5v5"/>
            </svg>
          </button>
          <p class="stage-status" data-role="hdr-status" aria-live="polite" hidden></p>
        </div>
        <!-- The drop target is the whole panel, but the invitation is a card. -->
        <div class="stage-empty" data-role="stage-empty">
          <div class="stage-empty-card">
            <span class="stage-empty-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
              </svg>
            </span>
            <span class="stage-empty-title" data-role="stage-title" data-i18n="stage.empty">拖放或选择图片</span>
            <span class="stage-support" id="stage-drop-hint" data-role="stage-support">支持 RAW · HEIC · JPG · PNG · AVIF</span>
            <button class="button button--primary stage-select" type="button"
                    data-role="stage-select" aria-describedby="stage-drop-hint"
                    data-i18n="stage.select">选择图片</button>
            <span class="stage-progress" aria-hidden="true"><span class="stage-progress-fill" data-role="upload-bar"></span></span>
            <span class="stage-progress-text" data-role="upload-progress" aria-live="polite"></span>
          </div>
        </div>
        <input type="file" data-role="file-input" hidden
               accept="image/*">
      </div>
    </div>
  </main>

  <div class="app__rail">
  <header class="app__header">
    <h1 class="app__title wordmark" aria-label="HyperDR">
      <!-- Reuse the exact desktop application icon. -->
      <img class="wordmark-mark" src="./icon.svg" alt="" aria-hidden="true">
      <span class="wordmark-text" aria-hidden="true">
        <span class="wordmark-accent">H</span><span class="wordmark-name">yper</span><span class="wordmark-accent">DR</span>
      </span>
    </h1>
    <!-- The only place service state is reported. -->
    <p class="service-state" data-role="service-state" aria-live="polite">
      <span class="service-dot" data-role="service-dot"></span>
      <span data-role="service-text" data-i18n="app.service.detecting">正在检测…</span>
    </p>
    <button class="icon-button" type="button" data-role="theme-toggle" aria-pressed="false">
      <svg class="theme-icon theme-icon--sun" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg>
      <svg class="theme-icon theme-icon--moon" aria-hidden="true" viewBox="0 0 24 24"><path d="M20.2 15.3A8.5 8.5 0 0 1 8.7 3.8a8.5 8.5 0 1 0 11.5 11.5Z"/></svg>
    </button>
    <!-- The header is the only region main.js never marks `inert`, so a global
         entry point belongs here rather than in the rail, which is disabled
         until a photograph is loaded. -->
    <button class="icon-button" type="button" data-role="prefs-open"
            aria-expanded="false" aria-haspopup="dialog"
            data-i18n-attr="aria-label:prefs.open;title:prefs.open">
      <svg class="prefs-icon" aria-hidden="true" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3.2"/>
        <path d="M19.6 13.4a7.7 7.7 0 0 0 0-2.8l1.9-1.5-1.9-3.3-2.3.9a7.7 7.7 0 0 0-2.4-1.4L14.5 3h-3.8l-.4 2.3a7.7 7.7 0 0 0-2.4 1.4l-2.3-.9-1.9 3.3 1.9 1.5a7.7 7.7 0 0 0 0 2.8l-1.9 1.5 1.9 3.3 2.3-.9a7.7 7.7 0 0 0 2.4 1.4l.4 2.3h3.8l.4-2.3a7.7 7.7 0 0 0 2.4-1.4l2.3.9 1.9-3.3Z"/>
      </svg>
    </button>
  </header>

  <aside class="app__settings" id="settings" data-i18n-attr="aria-label:adjust.label">
    <!-- Histogram & clipping inspection unit at the top of the rail -->
    <section class="scope" data-i18n-attr="aria-label:scope.label">
      <div class="scope-head">
        <div class="segmented segmented--small" role="group" data-role="hist-mode" data-i18n-attr="aria-label:scope.histMode"></div>
        <div class="scope-chips">
          <button class="chip chip--hot" type="button" data-role="clip-hot" aria-pressed="false" data-i18n-attr="title:scope.hotZebra">
            <span class="chip-swatch" aria-hidden="true"></span><span data-i18n="scope.hot">高光</span> <b data-role="clip-hot-value">0.0%</b>
          </button>
          <button class="chip chip--cold" type="button" data-role="clip-cold" aria-pressed="false" data-i18n-attr="title:scope.coldZebra">
            <span class="chip-swatch" aria-hidden="true"></span><span data-i18n="scope.cold">暗部</span> <b data-role="clip-cold-value">0.0%</b>
          </button>
        </div>
      </div>
      <div class="scope-plot">
        <canvas class="scope-graph" data-role="histogram" width="380" height="72"></canvas>
        <p class="scope-empty" data-i18n="scope.empty">暂无直方图数据</p>
      </div>
      <div class="scope-bar">
        <p class="scope-legend">
          <span class="swatch swatch--source" aria-hidden="true"></span><span data-i18n="scope.source">源分布</span>
          <span class="swatch swatch--output" aria-hidden="true"></span><span data-i18n="scope.output">扩展后</span>
        </p>
      </div>
    </section>

    <div class="group-head group-head--major">
      <h2 data-i18n="adjust.label">调整</h2>
      <div class="segmented optimize-toggle" role="group" data-i18n-attr="aria-label:adjust.mode">
        <button type="button" data-role="math-mode" aria-pressed="true" data-i18n="adjust.manual">手动</button>
        <button type="button" data-role="optimize" aria-pressed="false">AI 优化</button>
      </div>
      <button class="link-button" type="button" data-role="settings-reset"
              data-i18n-attr="title:adjust.resetTitle">重置</button>
    </div>

    <p class="group-note" data-role="optimize-note" hidden></p>

    <!-- 手动调整子菜单 -->
    <div class="settings-submenu settings-submenu--manual" data-role="submenu-manual">
      <div class="group" data-role="group-tone"></div>
      <h3 class="group-sub" data-i18n="adjust.region">作用区域</h3>
      <div class="group" data-role="group-region"></div>
      <div class="group" data-role="group-advanced"></div>
    </div>

    <!-- AI 优化子菜单 -->
    <div class="settings-submenu settings-submenu--ai" data-role="submenu-ai" hidden>
      <p class="group-note" data-i18n="adjust.aiNote">已启用 AI 优化；以下参数用于后置微调模型结果</p>
      <div class="group" data-role="group-model"></div>
    </div>
  </aside>

  <!-- Pinned to the bottom of the control column: the last decision and the
       button that acts on it never move and never scroll away. -->
  <footer class="app__run" id="run" data-i18n-attr="aria-label:out.label">
    <div class="out">
      <h2 class="out-label" data-i18n="out.format">输出格式</h2>
      <!-- The formats are laid out, not folded into a select: there are six,
           the choice drives the headroom ceiling below it, and a closed menu
           hides the one decision this block exists to make. -->
      <div class="segmented segmented--wrap out-formats" role="group"
           data-role="encoding" data-i18n-attr="aria-label:out.encoding"></div>
      <p class="out-hint" data-role="encoding-hint"></p>
      <!-- Under the grid, not in the heading row. Quality is a parameter of
           the format that was just chosen; an editable number sitting beside
           a section title reads as part of the title. -->
      <div class="out-quality" data-role="group-quality"></div>

      <section class="out-color" aria-labelledby="out-color-label">
        <h3 class="out-color-label" id="out-color-label" data-i18n="out.color">色彩与色域</h3>
        <div class="out-color-row">
          <div class="out-color-gamut">
            <span class="out-color-title" data-i18n="out.gamutTitle">输出色域</span>
            <div class="segmented segmented--wrap" role="group"
                 data-role="color-gamut" data-i18n-attr="aria-label:out.gamut"></div>
          </div>
          <button class="chip out-color-clamp" type="button"
                  data-role="clamp-srgb" aria-pressed="false"
                  data-i18n="out.clampSrgb">限制在 sRGB</button>
        </div>
        <p class="out-hint out-color-hint" data-role="color-hint"></p>
      </section>

      <div class="result" data-role="result" hidden aria-live="polite">
        <div class="result-info">
          <strong class="result-name" data-role="result-name"></strong>
          <span class="result-meta" data-role="result-meta"></span>
          <span class="result-warn" data-role="result-warn" hidden></span>
          <span class="result-stale" data-role="result-stale" hidden data-i18n="out.stale">设置已变更，需重新转换</span>
        </div>
        <div class="result-actions">
          <a class="button button--primary" data-role="download" download data-i18n="out.download">保存到设备</a>
        </div>
      </div>

      <p class="out-progress" data-role="run-progress" hidden aria-live="polite"></p>
      <div class="out-actions">
        <button class="button" type="button" data-role="cancel" hidden>取消</button>
        <button class="button button--primary button--run" type="button" data-role="run">开始转换</button>
      </div>
      <details class="out-command">
        <summary data-i18n="out.command">查看命令行</summary>
        <div class="out-command-popover">
          <code data-role="command-line">HyperDR …</code>
          <button class="link-button out-command-copy" type="button" data-role="command-copy" data-i18n="out.commandCopy">复制</button>
        </div>
      </details>
    </div>
  </footer>
  </div>

</div>

<!-- Application preferences. Distinct from the rail: that is 调整, per photo
     and sent to the converter; this is 偏好设置, per device and never sent. -->
<div class="prefs" data-role="prefs" hidden role="dialog" aria-modal="true"
     aria-labelledby="prefs-title">
  <div class="prefs-surface">
    <header class="prefs-head">
      <h2 class="prefs-title" id="prefs-title" data-i18n="prefs.title">偏好设置</h2>
      <button class="icon-button" type="button" data-role="prefs-close"
              data-i18n-attr="aria-label:prefs.close;title:prefs.close">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <nav class="prefs-nav segmented segmented--small" data-role="prefs-nav"
         role="group" data-i18n-attr="aria-label:prefs.nav"></nav>
    <div class="prefs-body" data-role="prefs-body"></div>
    <footer class="prefs-foot">
      <button class="link-button" type="button" data-role="prefs-copy-diagnostics"
              data-i18n="prefs.about.copy">复制诊断信息</button>
      <button class="link-button" type="button" data-role="prefs-reset"
              data-i18n="prefs.about.reset">重置全部偏好</button>
    </footer>
  </div>
</div>

<div class="toast" data-role="toast" role="status" aria-live="polite"></div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
