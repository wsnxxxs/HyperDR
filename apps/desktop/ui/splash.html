<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HyperDR</title>
  <style>
    /* Standalone shell: values mirror the desktop's dark tokens.css palette. */
    :root {
      color-scheme: dark;
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text",
        "Segoe UI", Inter, system-ui, "PingFang SC", "HarmonyOS Sans SC",
        "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      --surface-page: #17181b;
      --surface-panel: #1e1f23;
      --surface-sunken: #191a1e;
      --line: rgba(255, 255, 255, .08);
      --ink-strong: #f1f1f3;
      --ink: #c9cbd2;
      --ink-muted: #a1a4af;
      --accent: #8ba8ff;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; }
    body {
      display: grid; place-items: center; min-height: 100dvh;
      padding: 24px; background: var(--surface-page); color: var(--ink);
      font: 14px/1.6 var(--font-ui); user-select: none;
    }
    .splash-card {
      display: flex; flex-direction: column; align-items: center;
      width: min(420px, 100%); padding: 40px 24px; text-align: center;
      border: 1px solid var(--line); border-radius: 12px; background: var(--surface-panel);
    }
    .brand-icon-wrapper { margin-bottom: 24px; }
    .brand-mark { display: block; width: 64px; height: 64px; }
    .brand-title { margin: 0 0 8px; color: var(--ink-strong); font-size: 28px; font-weight: 600; letter-spacing: -.025em; line-height: 1.3; }
    .brand-subtitle { margin: 0 0 32px; color: var(--ink-muted); font-size: 13px; }
    .status-badge { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 12px 16px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-sunken); }
    .status-dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 1.8s ease-in-out infinite; }
    .status-text { font-size: 13px; }
    @keyframes pulse { 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { .status-dot { animation: none; } }
  </style>
</head>
<body>
  <main class="splash-card" role="region" aria-label="HyperDR 启动界面">
    <!-- Brand Mark: the exact desktop application icon. -->
    <div class="brand-icon-wrapper" aria-hidden="true">
      <img class="brand-mark" src="./icon.svg" alt="">
    </div>

    <!-- Wordmark Title & Tagline -->
    <h1 class="brand-title" aria-label="HyperDR">
      <span class="brand-accent">H</span>yper<span class="brand-accent">DR</span>
    </h1>
    <p class="brand-subtitle">HDR 图像增强与转换工具</p>

    <!-- Native Engine Startup Status -->
    <div class="status-badge" role="status" aria-live="polite">
      <span class="status-dot" aria-hidden="true"></span>
      <span class="status-text">正在启动本地转换引擎…</span>
    </div>
  </main>
</body>
</html>
