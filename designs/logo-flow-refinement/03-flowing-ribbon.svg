<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">HyperDR — 掠光 · 流带</title>
  <desc id="desc">同一光带由宽变窄再展开，两个末端朝相反方向延伸，形成连续的流动曲线。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#24282c"/><stop offset="1" stop-color="#111316"/></linearGradient>
    <linearGradient id="body" x1=".15" y1="0" x2=".7" y2="1"><stop stop-color="#d7e6ec"/><stop offset=".32" stop-color="#83b7ce"/><stop offset=".7" stop-color="#5088ad"/><stop offset="1" stop-color="#25425f"/></linearGradient>
    <linearGradient id="face" x1=".2" y1="0" x2=".7" y2="1"><stop stop-color="#fff"/><stop offset=".4" stop-color="#e1eaf0"/><stop offset=".77" stop-color="#aac3d2"/><stop offset="1" stop-color="#6c9ab7"/></linearGradient>
    <linearGradient id="rim" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#c4e7f4" stop-opacity="0"/></linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="17" y="17" width="478" height="478" rx="111" fill="none" stroke="#fff" stroke-opacity=".1"/>
