name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-core:
    name: Core (macOS arm64, ${{ matrix.build_type }})
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure core
        run: cmake --preset macos-arm64-core -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Test core, native contracts and C ABI
        run: python3 scripts/test.py native --build-dir build-core --config ${{ matrix.build_type }}

  macos-codecs:
    name: Codecs (macOS arm64)
    runs-on: xcode-27
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/build-vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: brew install ninja pkg-config
      - name: Check out pinned vcpkg baseline
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 43643e1f5cf73db40d0d4bd610183348eb09b24e
          path: build-vcpkg
      - name: Bootstrap vcpkg
        run: build-vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - uses: actions/cache@v4
        with:
          path: build-vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/**') }}
          restore-keys: vcpkg-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache RAW test fixtures
        uses: actions/cache@v4
        with:
          path: build/fixtures
          key: raw-fixtures-${{ hashFiles('tests/fixtures/manifest.json') }}
      - name: Fetch and verify RAW test fixtures
        run: python3 scripts/fetch_test_fixtures.py
      - name: Configure codecs
        run: >-
          cmake --preset macos-arm64-codecs
          -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/build-vcpkg/scripts/buildsystems/vcpkg.cmake"
      - name: Build and test codecs, native contracts and C ABI
        run: python3 scripts/test.py native --build-dir build
      - name: GPL license gate
        run: python3 .github/scripts/check_licenses.py build

  macos-sanitizers:
    name: C ABI (ASan + UBSan)
    runs-on: xcode-27
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/build-vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: brew install ninja pkg-config
      - name: Check out pinned vcpkg baseline
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 43643e1f5cf73db40d0d4bd610183348eb09b24e
          path: build-vcpkg
      - name: Bootstrap vcpkg
        run: build-vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - uses: actions/cache@v4
        with:
          path: build-vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/**') }}
          restore-keys: vcpkg-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache RAW test fixtures
        uses: actions/cache@v4
        with:
          path: build/fixtures
          key: raw-fixtures-${{ hashFiles('tests/fixtures/manifest.json') }}
      - name: Fetch and verify RAW test fixtures
        run: python3 scripts/fetch_test_fixtures.py
      - name: Configure sanitizers
        run: >-
          cmake --preset macos-arm64-codecs -B build-asan
          -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/build-vcpkg/scripts/buildsystems/vcpkg.cmake" -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-asan --parallel
      - name: C ABI lifecycle and packaging
        env:
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build-asan -R '^capi_(shared|static|package|package_rows)_test$' --output-on-failure

  apple-app:
    name: Apple app (macOS 27 arm64)
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      VCPKG_ROOT: ${{ github.workspace }}/build-vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/build-vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: brew install ninja pkg-config
      - name: Show tool versions
        run: |
          sw_vers
          xcodebuild -version
          xcrun swift --version
      - name: Check out pinned vcpkg baseline
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 43643e1f5cf73db40d0d4bd610183348eb09b24e
          path: build-vcpkg
      - name: Bootstrap vcpkg
        run: build-vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - uses: actions/cache@v4
        with:
          path: build-vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/**') }}
          restore-keys: vcpkg-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache RAW test fixtures
        uses: actions/cache@v4
        with:
          path: build/fixtures
          key: raw-fixtures-${{ hashFiles('tests/fixtures/manifest.json') }}
      - name: Fetch and verify RAW test fixtures
        run: python3 scripts/fetch_test_fixtures.py
      - name: Ensure Metal Toolchain
        run: |
          if ! xcodebuild -showComponent MetalToolchain 2>/dev/null | grep -q 'Status: installed'; then
            xcodebuild -downloadComponent MetalToolchain
          fi
      - name: Test Apple app and Swift packages
        run: python3 scripts/test.py apple
      - name: Upload Apple logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apple-app-logs
          path: |
            build-apple/DerivedData/Logs
            build-apple/**/*.xcresult
          if-no-files-found: ignore
