[package]
name = "hyperdr-desktop"
version = "0.1.0"
description = "HyperDR desktop shell"
authors = ["HyperDR"]
edition = "2021"

[lib]
name = "hyperdr_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
url = "2"
