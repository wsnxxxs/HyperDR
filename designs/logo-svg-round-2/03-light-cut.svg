    <linearGradient id="white" x1="0" y1=".2" x2="1" y2=".6"><stop stop-color="#fff"/><stop offset=".55" stop-color="#e5edf2"/><stop offset="1" stop-color="#9bb5c7"/></linearGradient>
    <linearGradient id="edge" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#a4c8dd" stop-opacity="0"/></linearGradient>
  </defs>
