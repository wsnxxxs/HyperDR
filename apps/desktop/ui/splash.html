<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HyperDR</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #17181b; color: #f4f5f7; }
    main { text-align: center; }
    h1 { margin: 0 0 0.6rem; letter-spacing: 0.04em; }
    p { margin: 0; color: #aeb3bd; }
    .dot { display: inline-block; width: 0.55rem; height: 0.55rem;
      margin-right: 0.45rem; border-radius: 50%; background: #8ce6c0;
      box-shadow: 0 0 1rem #8ce6c0; }
  </style>
</head>
<body>
  <main>
    <h1>HyperDR</h1>
    <p><span class="dot"></span>正在启动本地转换引擎…</p>
  </main>
</body>
</html>
