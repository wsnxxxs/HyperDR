<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">HyperDR — 月弧 · 上下镜像精修</title>
  <desc id="desc">保留月弧的上下镜像轮廓，主体向右光学校正 10 像素。银白高光重新落在左上弧面，蓝灰内侧随曲面渐暗，夜蓝底色与轻微光晕托出月光。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#1b2330"/><stop offset=".5" stop-color="#121a27"/><stop offset="1" stop-color="#0c121d"/></linearGradient>
    <radialGradient id="body" gradientUnits="userSpaceOnUse" cx="205" cy="147" r="264"><stop stop-color="#d7e5f5"/><stop offset=".35" stop-color="#a9bfdc"/><stop offset=".72" stop-color="#6b87af"/><stop offset="1" stop-color="#415a7d"/></radialGradient>
    <radialGradient id="face" gradientUnits="userSpaceOnUse" cx="177" cy="161" r="290"><stop stop-color="#fffef7"/><stop offset=".32" stop-color="#f3f5f6"/><stop offset=".63" stop-color="#d8e2ee"/><stop offset=".85" stop-color="#afc1d9"/><stop offset="1" stop-color="#7895b8"/></radialGradient>
    <linearGradient id="rim" gradientUnits="userSpaceOnUse" x1="177" y1="150" x2="288" y2="386"><stop stop-color="#ffffff" stop-opacity=".72"/><stop offset=".42" stop-color="#e6eefb" stop-opacity=".23"/><stop offset="1" stop-color="#a8c3e5" stop-opacity="0"/></linearGradient>
    <radialGradient id="halo"><stop offset=".25" stop-color="#a5c3f0" stop-opacity=".085"/><stop offset=".6" stop-color="#87a9dc" stop-opacity=".035"/><stop offset="1" stop-color="#7598ce" stop-opacity="0"/></radialGradient>
    <linearGradient id="tile-rim" x2="1" y2="1"><stop stop-color="#d4e1f2" stop-opacity=".16"/><stop offset=".55" stop-color="#b6c9e4" stop-opacity=".055"/><stop offset="1" stop-color="#91a8cd" stop-opacity=".025"/></linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="17" y="17" width="478" height="478" rx="111" fill="none" stroke="url(#tile-rim)"/>
  <ellipse cx="236" cy="242" rx="180" ry="171" fill="url(#halo)"/>
  <path d="M375 379C305 409 226 388 175 330C119 268 128 185 186 145C246 104 330 135 367 205C325 162 269 163 235 197C200 232 207 287 247 326C282 361 327 369 375 379Z" fill="url(#body)"/>
  <path d="M375 379C305 409 226 388 175 330C119 268 128 185 186 145C246 104 330 135 367 205C316 147 243 140 200 186C161 228 173 287 215 328C259 370 318 382 375 379Z" fill="url(#face)"/>
  <path d="M375 379C305 409 226 388 175 330C119 268 128 185 186 145C246 104 330 135 367 205" fill="none" stroke="url(#rim)" stroke-width="1.2"/>
</svg>
