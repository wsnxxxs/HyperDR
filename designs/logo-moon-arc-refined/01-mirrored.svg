<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">HyperDR — 月弧上下镜像</title>
  <desc id="desc">原月弧主体上下镜像，保留原有材质随形状一起翻转，作为优化前对照。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b2330"/><stop offset=".6" stop-color="#101723"/><stop offset="1" stop-color="#0c111b"/></linearGradient>
    <linearGradient id="body" x1=".15" y1=".05" x2=".72" y2="1"><stop stop-color="#e3edf8"/><stop offset=".3" stop-color="#acc4e0"/><stop offset=".68" stop-color="#6683b0"/><stop offset="1" stop-color="#344966"/></linearGradient>
    <linearGradient id="face" x1=".2" y1=".15" x2=".8" y2="1"><stop stop-color="#fffdf2"/><stop offset=".35" stop-color="#eef1f3"/><stop offset=".65" stop-color="#c9d8eb"/><stop offset="1" stop-color="#748eaf"/></linearGradient>
    <linearGradient id="rim" x1=".3" y1="0" x2=".4" y2="1"><stop stop-color="#fffdf1" stop-opacity=".95"/><stop offset=".5" stop-color="#e8efff" stop-opacity=".45"/><stop offset="1" stop-color="#a9c5ff" stop-opacity="0"/></linearGradient>
    <radialGradient id="halo"><stop offset=".35" stop-color="#98b2e7" stop-opacity=".12"/><stop offset=".65" stop-color="#7a98d3" stop-opacity=".055"/><stop offset="1" stop-color="#7799d6" stop-opacity="0"/></radialGradient>
    <radialGradient id="moon-disc" cx=".28" cy=".34" r=".8"><stop stop-color="#859bbe" stop-opacity=".13"/><stop offset=".8" stop-color="#667d9e" stop-opacity=".035"/><stop offset="1" stop-color="#586b85" stop-opacity=".01"/></radialGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="17" y="17" width="478" height="478" rx="111" fill="none" stroke="#d8e4ff" stroke-opacity=".12"/>
  <ellipse cx="235" cy="268" rx="166" ry="163" fill="url(#halo)" opacity=".35"/>
  <g transform="translate(0 512) scale(1 -1)">
  <path d="M365 133C295 103 216 124 165 182C109 244 118 327 176 367C236 408 320 377 357 307C315 350 259 349 225 315C190 280 197 225 237 186C272 151 317 143 365 133Z" fill="url(#body)"/>
  <path d="M365 133C295 103 216 124 165 182C109 244 118 327 176 367C236 408 320 377 357 307C306 365 233 372 190 326C151 284 163 225 205 184C249 142 308 130 365 133Z" fill="url(#face)"/>
  <path d="M165 182C216 124 295 103 365 133" fill="none" stroke="url(#rim)" stroke-width="2"/>
  </g>
</svg>
