name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-core:
    name: Core (macOS arm64, ${{ matrix.build_type }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Configure core
        run: cmake --preset macos-arm64-core -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Test core, native contracts and C ABI
        run: python3 scripts/test.py native --build-dir build-core --config ${{ matrix.build_type }}

  macos-codecs:
    name: Codecs (macOS arm64)
    runs-on: macos-26
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/build-vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install build tools
        run: brew install ninja pkg-config
      - name: Check out pinned vcpkg baseline
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 43643e1f5cf73db40d0d4bd610183348eb09b24e
          path: build-vcpkg
      - name: Bootstrap vcpkg
        run: build-vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - uses: actions/cache@v4
        with:
          path: build-vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/**') }}
          restore-keys: vcpkg-${{ runner.os }}-${{ runner.arch }}-
      - name: Configure codecs
        run: >-
          cmake --preset macos-arm64-codecs
          -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/build-vcpkg/scripts/buildsystems/vcpkg.cmake"
      - name: Build and test codecs, native contracts and C ABI
        run: python3 scripts/test.py native --build-dir build
      - name: GPL license gate
        run: python3 .github/scripts/check_licenses.py build
      - name: CLI export smoke
        run: python3 tests/capi/smoke.py build/HyperDR

  macos-sanitizers:
    name: C ABI (ASan + UBSan)
    runs-on: macos-26
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/build-vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: brew install ninja pkg-config
      - name: Check out pinned vcpkg baseline
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 43643e1f5cf73db40d0d4bd610183348eb09b24e
          path: build-vcpkg
      - name: Bootstrap vcpkg
        run: build-vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - uses: actions/cache@v4
        with:
          path: build-vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/**') }}
          restore-keys: vcpkg-${{ runner.os }}-${{ runner.arch }}-
      - name: Configure sanitizers
        run: >-
          cmake --preset macos-arm64-codecs -B build-asan
          -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/build-vcpkg/scripts/buildsystems/vcpkg.cmake" -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-asan --parallel
      - name: C11 lifecycle
        env:
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build-asan -R 'capi_(shared|static)_test' --output-on-failure
      - name: ctypes contracts
        env:
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          interpreter="$(python3 -c 'import pathlib,sys; p=pathlib.Path(sys.base_prefix)/"Resources/Python.app/Contents/MacOS/Python"; print(p if p.is_file() else sys.executable)')"
          runtime="$(clang --print-resource-dir)/lib/darwin/libclang_rt.asan_osx_dynamic.dylib"
          DYLD_INSERT_LIBRARIES="$runtime:$PWD/build-asan/libcapi_test_clock.dylib" \
            "$interpreter" tests/capi/contract_test.py build-asan/HyperDR build-asan/libhyperdr.dylib

  frontend:
    name: Frontend reference contracts
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python3 scripts/test.py frontend
